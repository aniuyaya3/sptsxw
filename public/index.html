<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VideoGen Daily — 视频生成开源风向标</title>
<meta name="description" content="每天 12:00，三个值得动手跑一遍的视频生成开源仓库。" />
<meta name="theme-color" content="#06070a" />
<meta property="og:type" content="website" />
<meta property="og:title" content="VideoGen Daily — 视频生成开源风向标" />
<meta property="og:description" content="每天 12:00，三个值得动手跑一遍的视频生成开源仓库。" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="VideoGen Daily" />
<meta name="twitter:description" content="每天 12:00，三个值得动手跑一遍的视频生成开源仓库。" />
<link rel="stylesheet" href="assets/css/tokens.css" />
<link rel="stylesheet" href="assets/css/base.css" />
<link rel="stylesheet" href="assets/css/layout.css" />
<link rel="stylesheet" href="assets/css/components.css" />
<link rel="stylesheet" href="assets/css/motion.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230b0d10'/><path d='M38 30l28 20-28 20z' fill='%235eead4'/></svg>" />
</head>
<body>
<a class="skip" href="#main">跳到内容</a>
<div class="grain" aria-hidden="true"></div>
<div class="aurora" aria-hidden="true">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
</div>

<header class="nav" id="nav">
  <div class="wrap nav-inner">
    <a class="logo" href="./">
      <span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M9 7.5v9l7.5-4.5L9 7.5z" fill="currentColor"/></svg></span>
      <span class="logo-text">VideoGen<em>Daily</em></span>
    </a>
    <div class="nav-cal-wrap">
      <button class="nav-pill" id="navDate" aria-haspopup="dialog" aria-expanded="false" title="按日期查看">
        <span id="navDateText">—</span>
        <svg class="cal-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="15" rx="3" stroke="currentColor" stroke-width="1.4"/><path d="M3.5 10h17M8 3.5v4M16 3.5v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <div class="cal-pop" id="calPop" role="dialog" aria-label="选择日期" hidden></div>
    </div>
  </div>
</header>

<main id="main">
  <section class="hero">
    <div class="wrap hero-grid">
      <div class="hero-main">
        <p class="eyebrow"><span class="pulse"></span>每日 12:00 更新</p>
        <h1>视频生成的<br /><span class="grad">开源风向标</span></h1>
        <p class="lede">每天三个值得动手跑一遍的仓库 —— 生成模型、创作工作流、推理加速。</p>
        <div class="stats">
          <div class="stat"><b id="statRepos">0</b><span>收录仓库</span></div>
          <div class="stat"><b id="statIssues">0</b><span>期更新</span></div>
          <div class="stat"><b id="statStars">0</b><span>累计 Star</span></div>
        </div>
      </div>
      <aside class="hero-side" id="heroTags" aria-label="按分类浏览作品"></aside>
    </div>
    <button class="hero-new" id="heroNew" hidden aria-label="返回首页顶部" title="返回首页顶部">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="#2d0fed">
        <path d="M0 0h24v24H0z" fill="none" />
        <circle cx="12" cy="12" r="0" fill="#2d0fed">
          <animate id="SVGPW9ARccz" fill="freeze" attributeName="r" begin="0;SVGaeu34cWL.end" calcMode="spline" dur="1.2s" keySplines=".52,.6,.25,.99" values="0;11" />
          <animate fill="freeze" attributeName="opacity" begin="0;SVGaeu34cWL.end" calcMode="spline" dur="1.2s" keySplines=".52,.6,.25,.99" values="1;0" />
        </circle>
        <circle cx="12" cy="12" r="0" fill="#2d0fed">
          <animate id="SVGODvPjeTJ" fill="freeze" attributeName="r" begin="SVGPW9ARccz.begin+0.2s" calcMode="spline" dur="1.2s" keySplines=".52,.6,.25,.99" values="0;11" />
          <animate fill="freeze" attributeName="opacity" begin="SVGPW9ARccz.begin+0.2s" calcMode="spline" dur="1.2s" keySplines=".52,.6,.25,.99" values="1;0" />
        </circle>
        <circle cx="12" cy="12" r="0" fill="#2d0fed">
          <animate id="SVGaeu34cWL" fill="freeze" attributeName="r" begin="SVGPW9ARccz.begin+0.4s" calcMode="spline" dur="1.2s" keySplines=".52,.6,.25,.99" values="0;11" />
          <animate fill="freeze" attributeName="opacity" begin="SVGPW9ARccz.begin+0.4s" calcMode="spline" dur="1.2s" keySplines=".52,.6,.25,.99" values="1;0" />
        </circle>
      </svg>
    </button>
  </section>

  <section class="wrap latest">
    <div class="section-head">
      <h2 id="sectionTitle">最新一期</h2>
      <span class="date" id="latestDate"></span>
    </div>
    <div class="cards" id="cards">
      <div class="card skeleton"></div>
      <div class="card skeleton"></div>
      <div class="card skeleton"></div>
    </div>
  </section>

  <section class="wrap archive" id="archive"></section>
</main>

<div class="fab-stack">
  <button class="fab scroll-top" id="scrollTop" hidden aria-label="回到顶部" title="回到顶部">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 18V6M12 6l-5 5M12 6l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>

<script type="module" src="assets/js/main.js"></script>
</body>
</html>
