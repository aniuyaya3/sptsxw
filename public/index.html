<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VideoGen Daily — 视频生成开源风向标</title>
<meta name="description" content="每天 12:00，三个值得动手跑一遍的视频生成开源仓库。" />
<meta name="theme-color" content="#06070a" />
<link rel="stylesheet" href="assets/style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230b0d10'/><path d='M38 30l28 20-28 20z' fill='%235eead4'/></svg>" />
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<div class="aurora" aria-hidden="true">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
</div>

<header class="nav" id="nav">
  <div class="wrap nav-inner">
    <a class="logo" href="./">
      <span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M9 7.5v9l7.5-4.5L9 7.5z" fill="currentColor"/></svg></span>
      <span class="logo-text">VideoGen<em>Daily</em></span>
    </a>
    <span class="nav-pill" id="navDate">—</span>
  </div>
</header>

<main>
  <section class="hero">
    <div class="wrap">
      <p class="eyebrow"><span class="pulse"></span>每日 12:00 更新</p>
      <h1>视频生成的<br /><span class="grad">开源风向标</span></h1>
      <p class="lede">每天三个值得动手跑一遍的仓库 —— 生成模型、创作工作流、推理加速。</p>
      <div class="stats">
        <div class="stat"><b id="statRepos">0</b><span>收录仓库</span></div>
        <div class="stat"><b id="statIssues">0</b><span>期更新</span></div>
        <div class="stat"><b id="statStars">0</b><span>累计 Star</span></div>
      </div>
    </div>
  </section>

  <section class="wrap latest">
    <div class="section-head">
      <h2>最新一期</h2>
      <span class="date" id="latestDate"></span>
    </div>
    <div class="cards" id="cards">
      <div class="card skeleton"></div>
      <div class="card skeleton"></div>
      <div class="card skeleton"></div>
    </div>
  </section>

  <section class="wrap archive" id="archive"></section>
</main>

<script src="assets/app.js"></script>
</body>
</html>
